<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneStop Shop | Gallery</title>
    <link rel="stylesheet" href="Gallery.css">
</head>
<body>
    <header class="site-header">
        <nav class="navbar">
            <a href="home.html" class="nav-logo">
                <img class="logo-img" src="Assets/OneStop logo.jpeg" alt="OneStop Shop">
            </a>
            <ul class="nav-menu">
                <li class="nav-item"><a href="home.html" class="nav-link">Home</a></li>
                <li class="nav-item"><a href="about.html" class="nav-link">About</a></li>
                <li class="nav-item"><a href="menu.html" class="nav-link">Menu</a></li>
                <li class="nav-item"><a href="testimonials.html" class="nav-link">Testimonials</a></li>
                <li class="nav-item"><a href="gallery.html" class="nav-link active">Gallery</a></li>
                <li class="nav-item"><a href="Contact.html" class="nav-link">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="page-hero">
            <h1>Gallery</h1>
            <p>A look at OneStop Shop, our drinks, our food and the people we serve every day.</p>
        </section>

        <section class="gallery">
            <figure class="gallery-item gallery-wide">
                <img src="Assets/Shop front.jpeg" alt="OneStop Shop storefront">
                <figcaption>Our shop front</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="Assets/Coffee.jpeg" alt="Freshly brewed coffee">
                <figcaption>Coffee</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="Assets/puff combo.jpeg" alt="Puff puff and beans combo">
                <figcaption>Puff puff and beans</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="Assets/Salad.jpeg" alt="Fresh salad bowl">
                <figcaption>Salad</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="Assets/Mineral water.jpeg" alt="Bottled mineral water">
                <figcaption>Mineral water</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="Assets/Carrot 3.jpeg" alt="Fresh carrot juice">
                <figcaption>Carrot juice</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="Assets/Counter.jpeg" alt="Serving counter at OneStop Shop">
                <figcaption>At the counter</figcaption>
            </figure>

            <figure class="gallery-item gallery-wide">
                <img src="Assets/Customers.jpeg" alt="Customers enjoying their orders">
                <figcaption>Our happy customers</figcaption>
            </figure>
        </section>
    </main>

    <footer class="site-footer">
        All rights reserved. Mbatu Tech Hub 2026
    </footer>
</body>
</html>
